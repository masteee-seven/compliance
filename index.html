<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>コンプラ脱出ゲーム | 整備工場からの脱出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#12161d;
    --bg-panel:#1c222c;
    --bg-panel-2:#232a35;
    --metal:#3a4250;
    --metal-light:#4b5567;
    --accent-yellow:#f5a623;
    --accent-red:#e2503d;
    --accent-green:#3ecf8e;
    --text-light:#f4f1ea;
    --text-muted:#8a93a6;
    --stripe: repeating-linear-gradient(135deg, #f5a623 0 14px, #12161d 14px 28px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-dark);
    color:var(--text-light);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900;}
  .mono{font-family:'Share Tech Mono', monospace; letter-spacing:0.08em;}

  #app{max-width:760px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ---- top hazard stripe ---- */
  .hazard-strip{height:8px; background:var(--stripe); flex-shrink:0;}

  /* ---- header / dashboard ---- */
  header{
    padding:18px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--metal);
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .eyebrow{font-size:11px; letter-spacing:0.2em; color:var(--accent-yellow); text-transform:uppercase;}
  .brand h1{font-size:19px; margin:0; line-height:1.3;}
  .gauge-cluster{display:flex; align-items:center; gap:14px;}
  .gauge{
    background:var(--bg-panel-2); border:1px solid var(--metal);
    border-radius:10px; padding:8px 14px; text-align:center; min-width:78px;
  }
  .gauge .label{font-size:10px; color:var(--text-muted); letter-spacing:0.1em;}
  .gauge .value{font-size:20px; margin-top:2px;}
  #timerValue.warn{color:var(--accent-red);}

  main{flex:1; padding:20px; display:flex; flex-direction:column; gap:20px;}

  /* ---- bay row (progress, signature element) ---- */
  .bay-row{display:flex; flex-wrap:wrap; gap:6px; padding:14px; background:var(--bg-panel); border-radius:12px; border:1px solid var(--metal);}
  .bay{
    flex:1 1 40px; min-width:36px; position:relative; height:44px; border-radius:6px; overflow:hidden;
    background:var(--bg-dark); border:1px solid var(--metal);
  }
  .bay .num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--text-muted); z-index:1; font-family:'Share Tech Mono', monospace;
  }
  .bay.done .num{color:var(--bg-dark);}
  .bay.current{border-color:var(--accent-yellow);}
  .shutter{
    position:absolute; inset:0; z-index:2;
    background:repeating-linear-gradient(0deg, var(--metal) 0 6px, var(--metal-light) 6px 11px);
    transform:translateY(0%);
    transition:transform 0.9s cubic-bezier(.4,1.4,.4,1);
  }
  .bay.done .shutter{transform:translateY(-100%);}
  .bay.done{background:var(--accent-green);}

  /* ---- panel / card ---- */
  .panel{
    background:var(--bg-panel); border:1px solid var(--metal); border-radius:14px;
    padding:24px; position:relative;
  }
  .bay-tag{
    display:flex; align-items:center; gap:8px; width:100%;
    font-size:12px; color:var(--accent-yellow); letter-spacing:0.1em;
    margin-bottom:10px; text-transform:uppercase;
  }
  .bay-tag .dot{width:7px; height:7px; border-radius:50%; background:var(--accent-yellow);}
  .panel h2{font-size:20px; margin:0 0 14px;}
  .scenario{
    background:var(--bg-panel-2); border-left:3px solid var(--metal-light);
    padding:14px 16px; border-radius:6px; font-size:15px; line-height:1.8; margin-bottom:18px;
  }
  .choices{display:flex; flex-direction:column; gap:10px;}
  .choice{
    display:flex; gap:12px; align-items:flex-start; text-align:left;
    background:var(--bg-panel-2); border:1px solid var(--metal); color:var(--text-light);
    padding:13px 16px; border-radius:8px; cursor:pointer; font-size:14.5px; line-height:1.6;
    font-family:inherit; transition:border-color .15s, background .15s;
  }
  .choice:hover{border-color:var(--metal-light);}
  .choice .letter{
    font-family:'Share Tech Mono', monospace; color:var(--accent-yellow); flex-shrink:0; font-size:14px;
  }
  .choice.correct{border-color:var(--accent-green); background:rgba(62,207,142,0.1);}
  .choice.wrong{border-color:var(--accent-red); background:rgba(226,80,61,0.1);}
  .choice[disabled]{cursor:default;}

  .feedback{margin-top:18px; padding:16px; border-radius:8px; font-size:14.5px; line-height:1.8;}
  .feedback.ok{background:rgba(62,207,142,0.1); border:1px solid var(--accent-green);}
  .feedback.ng{background:rgba(226,80,61,0.08); border:1px solid var(--metal-light);}
  .feedback .code-line{margin-top:10px; font-size:13px; color:var(--text-muted);}
  .feedback .code-digit{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:5px; background:var(--accent-green); color:var(--bg-dark);
    font-family:'Share Tech Mono', monospace; font-weight:700; margin-left:6px;
  }

  button.primary{
    margin-top:18px; width:100%; padding:14px; border-radius:8px; border:none;
    background:var(--accent-yellow); color:#1a1300; font-weight:700; font-size:15px;
    cursor:pointer; font-family:'Noto Sans JP', sans-serif;
  }
  button.primary:disabled{opacity:0.35; cursor:not-allowed;}
  button.ghost{
    margin-top:10px; width:100%; padding:12px; border-radius:8px;
    background:transparent; border:1px solid var(--metal-light); color:var(--text-light);
    cursor:pointer; font-size:14px; font-family:'Noto Sans JP', sans-serif;
  }

  /* ---- start / team screen ---- */
  .start-hero{text-align:center; padding:10px 4px 4px;}
  .start-hero .display{font-size:26px; line-height:1.4;}
  .start-hero p{color:var(--text-muted); font-size:14px; line-height:1.8;}
  input.team-input{
    width:100%; padding:14px 16px; border-radius:8px; border:1px solid var(--metal-light);
    background:var(--bg-panel-2); color:var(--text-light); font-size:15px; margin-top:14px;
    font-family:'Noto Sans JP', sans-serif;
  }
  input.team-input:focus{outline:none; border-color:var(--accent-yellow);}

  /* ---- final code lock ---- */
  .code-vault{display:flex; gap:8px; justify-content:center; margin:18px 0; flex-wrap:wrap;}
  .code-vault .slot{
    width:34px; height:44px; border-radius:6px; background:var(--bg-panel-2);
    border:1px solid var(--metal-light); display:flex; align-items:center; justify-content:center;
    font-family:'Share Tech Mono', monospace; font-size:20px;
  }
  .code-vault .slot.filled{border-color:var(--accent-green); color:var(--accent-green);}

  /* ---- recap screen ---- */
  .recap-item{padding:14px 0; border-bottom:1px solid var(--metal);}
  .recap-item:last-child{border-bottom:none;}
  .recap-item .theme{font-size:12px; color:var(--accent-yellow); letter-spacing:0.08em; margin-bottom:4px;}
  .recap-item .point{font-size:14.5px; line-height:1.7;}
  textarea.reflect{
    width:100%; min-height:80px; margin-top:14px; padding:12px 14px; border-radius:8px;
    background:var(--bg-panel-2); border:1px solid var(--metal-light); color:var(--text-light);
    font-family:'Noto Sans JP', sans-serif; font-size:14px; resize:vertical;
  }
  .result-summary{display:flex; gap:12px; margin:14px 0; flex-wrap:wrap;}
  .result-summary .box{flex:1; min-width:110px; background:var(--bg-panel-2); border:1px solid var(--metal); border-radius:8px; padding:12px; text-align:center;}
  .result-summary .box .n{font-size:22px; font-family:'Share Tech Mono', monospace; color:var(--accent-green);}
  .result-summary .box .l{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .copy-box{
    background:var(--bg-dark); border:1px dashed var(--metal-light); border-radius:8px;
    padding:12px 14px; font-size:12.5px; color:var(--text-muted); white-space:pre-wrap; margin-top:10px;
    font-family:'Share Tech Mono', monospace; line-height:1.7;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--accent-green); color:var(--bg-dark); padding:10px 20px; border-radius:20px;
    font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  footer{padding:14px 20px; text-align:center; font-size:11px; color:var(--text-muted);}

  @media (max-width:480px){
    .gauge-cluster{gap:8px;}
    .gauge{min-width:64px; padding:6px 8px;}
    .panel{padding:18px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="hazard-strip"></div>
  <header>
    <div class="brand">
      <span class="eyebrow">NETZ NEWLY</span>
      <h1 class="display" id="headerTitle">整備工場からの脱出</h1>
    </div>
    <div class="gauge-cluster">
      <div class="gauge">
        <div class="label">TEAM</div>
        <div class="value mono" id="gaugeTeam" style="font-size:14px;">-</div>
      </div>
      <div class="gauge">
        <div class="label">TIME</div>
        <div class="value mono" id="timerValue">15:00</div>
      </div>
    </div>
  </header>

  <main>
    <div class="bay-row" id="bayRow"></div>
    <div id="screen"></div>
  </main>
  <footer>ネッツトヨタニューリー北大阪 コンプライアンス研修用ツール</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- ゲームデータ ---------------- */
const STAGES = [
  {
    bay:"BAY 1｜受付", theme:"ハラスメント", difficulty:1,
    scenario:"商談ミスが3回続いた新人に、上司が個室で「原因を自分なりに分析して報告してほしい」と30分指導した。他の人がいる場では叱っていない。",
    q:"この指導について正しいのはどれ？",
    choices:[
      "業務上の適正な指導の範囲",
      "個室で30分も指導している時点でパワハラにあたる可能性が高い"
    ],
    correct:0,
    explain:"業務上の必要性があり、人格否定・威圧・見せしめを伴わない指導は、パワハラの6類型には該当しません。「みんなの前で」「人格への言及」「長時間の繰り返し」が加わると一気にアウト側へ傾きます。",
    why:"パワハラをする上司の多くは悪意ではなく「自分が厳しく育てられた」経験の再生産です。個人の自制心に頼るより、指導の場所・時間・言葉遣いを組織としてガイドライン化しておくことが防止策になります。",
    digit:"5",
    recap:"適切な場所・時間・言葉で行う指導は問題ない。危ういのは「人前」「人格否定」「長時間の繰り返し」。"
  },
  {
    bay:"BAY 2｜事務所(仕入れ担当)", theme:"取引先関係", difficulty:3,
    scenario:"資金繰りが厳しく、部品の仕入れ先への支払いを「今月分は来月に」と口頭でお願いし、先方も快く了承してくれた。",
    q:"この対応について正しいのはどれ？",
    choices:[
      "先方が了承しているので問題ない",
      "先方の合意があっても、支払遅延として違法のおそれがある"
    ],
    correct:1,
    explain:"取適法(旧下請法)の支払期日規制は、当事者間の合意では免れられません。発注側が優越的な立場にある関係での「合意」は、自由な意思によるものと見なされないためです。支払遅延は毎年多数の勧告・指導が出ている典型違反です。",
    why:"発注側の担当者も自社の資金繰りに追われる弱い立場です。「先方が了承してくれた」は最も危険な安心材料。支払条件の変更は必ず上長・法務の承認を通す、というルール化が担当者個人を守ります。",
    digit:"8",
    recap:"取引先の「了承」は免罪符にならない。支払条件の変更は必ず正式な承認フローを通す。"
  },
  {
    bay:"BAY 3｜試乗コース", theme:"社用車・車内での情報管理", difficulty:2,
    scenario:"来店予約の電話を受けたスタッフが、お客様の氏名・連絡先をメモした付箋を、そのまま社用車のダッシュボードに貼って試乗に出た。",
    q:"この対応について正しいのはどれ？",
    choices:[
      "社用車の中だけの話なので問題ない",
      "同乗するお客様や第三者の目に触れる可能性があり、管理として不十分"
    ],
    correct:1,
    explain:"社用車内も、同乗者や駐車時に外から見える環境である以上「管理された場所」とは言えません。個人情報を記載したメモは、車内であっても第三者の目に触れない形(裏返す・回収する等)で扱う必要があります。",
    why:"「自分の作業スペースだから大丈夫」という思い込みが一番の落とし穴です。オフィスのデスクだけでなく、車内・ロッカー・カウンターなど「自分のテリトリー」全般に同じ意識を広げることが必要です。",
    digit:"2",
    recap:"個人情報メモは、社用車の中や自分の作業スペースであっても放置しない。"
  },
  {
    bay:"BAY 4｜商談ブース", theme:"景品表示法・不当表示", difficulty:3,
    scenario:"展示車のPOPに「今だけ全車30万円引き！」と表示。実際の対象は一部在庫のみだったが、店内には対象車の一覧を用意しており、聞かれれば説明できる状態にしていた。",
    q:"この表示について正しいのはどれ？",
    choices:[
      "聞かれれば説明できる準備があるので問題ない",
      "表示そのものが実態と異なっていれば、口頭で説明できる用意があっても不当表示になり得る"
    ],
    correct:1,
    explain:"景品表示法が問題にするのは「表示を見た平均的なお客様がどう受け取るか」です。POP自体が「全車」と読める以上、別途説明できる準備があっても、表示そのものの誤認riskは解消されません。表示は実態と一致させる必要があります。",
    why:"「後から説明できるから大丈夫」はKPI(集客)の焦りが生む典型的な言い訳です。出稿前に表示内容と実際の対象条件が一致しているか、公開前チェックの仕組みを設けることが根本対策になります。",
    digit:"1",
    recap:"「聞かれれば説明できる」は言い訳にならない。表示そのものを実態と一致させる。"
  },
  {
    bay:"BAY 5｜整備工場(見積作成)", theme:"IT・生成AI利用", difficulty:3,
    scenario:"新人スタッフが、お客様との商談メモや車検の見積り内容をそのまま無料の外部生成AIツールに貼り付け、案内文の下書きを作らせようとしている。「効率化のためだから」と本人は良かれと思っている。",
    q:"この対応について正しいのはどれ？",
    choices:[
      "業務効率化が目的なら問題ない",
      "お客様の情報を外部の無料AIツールに入力すること自体にリスクがある"
    ],
    correct:1,
    explain:"無料の外部生成AIツールは、入力内容が学習データに使われたり、想定外の形で保存・流出したりするリスクがあります。お客様の氏名・車両情報・商談内容などを許可なく入力すること自体が情報漏洩リスクになります。",
    why:"動機は「早く終わらせたい」という善意であることがほとんどです。禁止するだけでは目の届かない場所で使われ続けます。会社として安全な(学習に使われない)法人契約のAI環境を用意し、「安全に使わせる」方向で対応するのが実効性のある対策です。",
    digit:"6",
    recap:"お客様情報を無料の外部AIツールにそのまま入力しない。会社が用意した環境を使う。"
  },
  {
    bay:"BAY 6｜事務所(勤怠管理)", theme:"労働時間", difficulty:2,
    scenario:"月末で業務が立て込み実際は20時まで働いたが、先輩から「打刻は定時の18時のままで」と言われ、本人も「多少のサービス残業は仕方ない」と納得していた。",
    q:"この対応について正しいのはどれ？",
    choices:[
      "本人も納得しているので問題ない",
      "本人が納得していても、実労働時間と異なる打刻は労働基準法上問題になる"
    ],
    correct:1,
    explain:"実労働時間と異なる打刻を行わせることは、賃金未払い(サービス残業)につながり、本人の同意の有無に関わらず労働基準法に抵触するおそれがあります。実労働時間はそのまま正確に記録することが原則です。",
    why:"「迷惑をかけたくない」「評価を下げたくない」という本人の気遣いが、問題を見えなくします。個人の納得を理由にせず、申告することが不利にならない運用と、業務量そのものの見直しが必要です。",
    digit:"9",
    recap:"本人の「納得」は免罪符にならない。実労働時間は正確に記録する。"
  },
  {
    bay:"BAY 7｜バックヤード", theme:"経費・利益相反", difficulty:3,
    scenario:"部品の仕入れ先の担当者から、展示会の帰りに数千円程度の食事をご馳走になった。「大した金額じゃないし、いつもお世話になっているから」と黙って受け取った。",
    q:"この対応について正しいのはどれ？",
    choices:[
      "少額であれば個人の判断で受けて問題ない",
      "少額でも自己判断で受け取らず、会社の指針に沿って報告・確認すべき"
    ],
    correct:1,
    explain:"金額の大小に関わらず、取引先からの利益供与は利益相反や癒着の入り口になり得ます。「少額だから」という正当化がしやすい場面ほど、実は判断を誤りやすいポイントです。",
    why:"「数百円・数千円だし」「お世話になっているから」は、少額不正が常態化する典型パターンです。少額こそ自己判断させず、自己申告フォームなど「言い出しやすい仕組み」を用意することが有効です。",
    digit:"4",
    recap:"取引先からの接待・贈答は、金額に関わらず自己判断せず会社のルールで確認する。"
  },
  {
    bay:"BAY 8｜試乗コース", theme:"交通安全・法令遵守", difficulty:2,
    scenario:"試乗希望の常連客からわずかにお酒の匂いがした。対応したスタッフは「いつも安全運転をされる方だから大丈夫」と信頼し、そのまま試乗を進めようとしている。",
    q:"最も適切な判断はどれ？",
    choices:[
      "普段の信頼関係があるので問題ない",
      "信頼関係があっても、飲酒の疑いがある状態での運転は許可してはいけない"
    ],
    correct:1,
    explain:"飲酒運転は道路交通法違反であり、量や相手への信頼度に関わらず運転させてはいけません。試乗は「お客様に運転してもらう」行為である以上、店側にも安全配慮義務があります。",
    why:"「いつもの人だから大丈夫」という信頼は、判断を鈍らせる一番の要因です。相手が誰であっても同じ基準で確認する、という機械的なルールにしておくことが、スタッフ個人の胆力に頼らない防止策になります。",
    digit:"7",
    recap:"「いつもの信頼できるお客様だから」は例外理由にならない。基準は誰に対しても同じ。"
  },
  {
    bay:"BAY 9｜整備工場(査定)", theme:"整備記録・下取り車の適正表示", difficulty:3,
    scenario:"下取り車について前オーナーは「事故はしていない」と申告しており、社内点検でも決定的な修復歴の証拠は確認できなかった。担当者は「申告通り修復歴なしとしていいか」と考えている。",
    q:"この対応について正しいのはどれ？",
    choices:[
      "前オーナーの申告通り「修復歴なし」としてよい",
      "申告のみに頼らず、社内基準に基づく確認を尽くした上で表示すべき"
    ],
    correct:1,
    explain:"修復歴の有無は車両価値・安全性に直結する重要事項です。前オーナーの申告だけを根拠に断定するのではなく、社内の点検基準に沿って確認を尽くし、確認できなかった場合はその旨を含めて正確に伝える必要があります。",
    why:"「申告通りにしておけば自分の責任にはならない」という考えが、確認不足のまま表示を進める動機になりがちです。査定・確認の手順を標準化し、「わからない場合はどう表示するか」まで仕組みで決めておくことが有効です。",
    digit:"3",
    recap:"前オーナーの申告は参考情報。社内基準での確認を尽くさずに断定表示しない。"
  },
  {
    bay:"BAY 10｜出口ロビー", theme:"私生活・SNS", difficulty:1,
    scenario:"あるスタッフが個人のSNSで、勤務先の店舗名は出さずに「今日の接客最悪だった」と愚痴を投稿した。「店名を出していないから大丈夫」と思っている。",
    q:"この投稿について正しいのはどれ？",
    choices:[
      "店名を出していないので問題ない",
      "店名を出していなくても、投稿内容から特定され会社の信用を損なうリスクがある"
    ],
    correct:1,
    explain:"店名を伏せていても、勤務地・時間帯・写真・過去の投稿などから個人や店舗が特定されるケースは珍しくありません。特定された場合、お客様への評価や会社の信用に直結します。",
    why:"飲酒運転や匿名の愚痴も、社内に安全な発散先がないことと地続きです。禁止するだけでなく、1on1や相談窓口など「社内で吐き出せる場」を用意することが根本的な対策になります。",
    digit:"0",
    recap:"「店名を出していない」は安全ではない。社内の相談窓口など、発散先を社内に持つ。"
  }
];
const TOTAL_SECONDS = 15*60;
// ▼Googleフォーム連携用の設定(下記の「Googleフォーム連携_設定手順.md」の手順で作成後、ここに貼り付ける)
// 認証不要でスプレッドシートに結果が集まる方式です。
const GOOGLE_FORM_CONFIG = {
  actionUrl: "https://docs.google.com/forms/d/e/1FAIpQLSeZhkITEzsWkP5EetT6tIMZTPtB__SYyC0sr5NbfJd0rFMiog/formResponse",   // 例: "https://docs.google.com/forms/d/e/XXXXXXXX/formResponse"
  entryTeamName: "entry.698826240",  // 例: "entry.111111111"（チーム名の質問）
  entryElapsed: "entry.2070573307",   // 例: "entry.222222222"（クリアタイムの質問）
  entryCode: "entry.1774794188",      // 例: "entry.333333333"（脱出コードの質問）
  entryReflect: "entry.752780054"    // 例: "entry.444444444"（振り返りメモの質問）
};

/* ---------------- 状態 ---------------- */
let state = {
  teamName:"",
  stageIndex:0,
  answered:new Array(STAGES.length).fill(false),
  code:new Array(STAGES.length).fill(""),
  timerId:null,
  secondsLeft:TOTAL_SECONDS,
  startedAt:null,
  finishedAt:null
};

const screen = document.getElementById('screen');
const bayRow = document.getElementById('bayRow');
const gaugeTeam = document.getElementById('gaugeTeam');
const timerValue = document.getElementById('timerValue');
const headerTitle = document.getElementById('headerTitle');

function renderBayRow(){
  bayRow.innerHTML = STAGES.map((s,i)=>{
    let cls = 'bay';
    if(state.answered[i]) cls += ' done';
    else if(i===state.stageIndex) cls += ' current';
    return `<div class="${cls}"><div class="shutter"></div><div class="num">${i+1}</div></div>`;
  }).join('');
}

function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+':'+s;
}

function startTimer(){
  state.startedAt = Date.now();
  state.timerId = setInterval(()=>{
    state.secondsLeft--;
    if(state.secondsLeft<=0){
      state.secondsLeft = 0;
      clearInterval(state.timerId);
    }
    timerValue.textContent = fmtTime(state.secondsLeft);
    if(state.secondsLeft <= 180) timerValue.classList.add('warn');
  },1000);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- 画面: スタート ---------------- */
function renderStart(){
  headerTitle.textContent = "整備工場からの脱出";
  bayRow.style.display = 'none';
  screen.innerHTML = `
    <div class="panel">
      <div class="start-hero">
        <div class="display" style="font-size:13px; color:var(--accent-yellow); letter-spacing:0.15em; margin-bottom:10px;">MISSION BRIEFING</div>
        <div class="display" style="font-size:24px; line-height:1.5;">ある日突然、整備工場の<br>全シャッターが下りた。</div>
        <p>原因は10個の「コンプライアンス違反の芽」。<br>
        グレーゾーンの2択、正しい判断を選んでシャッターを開けろ。<br>
        10個のコードを集めて、脱出せよ。</p>
      </div>
      <input class="team-input" id="teamInput" placeholder="チーム名・店舗名を入力(例: 豊中店Aチーム)" maxlength="30">
      <button class="primary" id="startBtn" disabled>ミッション開始 / シャッターが閉まる前に</button>
    </div>
  `;
  const input = document.getElementById('teamInput');
  const btn = document.getElementById('startBtn');
  input.addEventListener('input', ()=>{ btn.disabled = input.value.trim().length===0; });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !btn.disabled) btn.click(); });
  btn.addEventListener('click', ()=>{
    state.teamName = input.value.trim();
    gaugeTeam.textContent = state.teamName;
    bayRow.style.display = 'flex';
    renderBayRow();
    startTimer();
    renderStage(0);
  });
}

/* ---------------- 画面: ステージ ---------------- */
function renderStage(i){
  state.stageIndex = i;
  renderBayRow();
  const s = STAGES[i];
  headerTitle.textContent = s.bay;
  screen.innerHTML = `
    <div class="panel">
      <div class="bay-tag"><span class="dot"></span>${s.theme}<span style="margin-left:auto; color:var(--text-muted); letter-spacing:0;">難易度 ${'●'.repeat(s.difficulty)}${'○'.repeat(3-s.difficulty)}</span></div>
      <h2>ロックを解除せよ</h2>
      <div class="scenario">${s.scenario}</div>
      <div style="font-weight:700; margin-bottom:10px; font-size:15px;">${s.q}</div>
      <div class="choices" id="choicesWrap">
        ${s.choices.map((c,ci)=>`<button class="choice" data-i="${ci}"><span class="letter">${String.fromCharCode(65+ci)}</span><span>${c}</span></button>`).join('')}
      </div>
      <div id="feedbackWrap"></div>
    </div>
  `;
  document.querySelectorAll('#choicesWrap .choice').forEach(btn=>{
    btn.addEventListener('click', ()=>handleAnswer(i, parseInt(btn.dataset.i)));
  });
}

function handleAnswer(stageIdx, choiceIdx){
  const s = STAGES[stageIdx];
  const buttons = document.querySelectorAll('#choicesWrap .choice');
  buttons.forEach(b=>b.setAttribute('disabled','true'));
  const isCorrect = choiceIdx === s.correct;
  buttons[choiceIdx].classList.add(isCorrect ? 'correct' : 'wrong');
  if(!isCorrect){ buttons[s.correct].classList.add('correct'); }

  state.answered[stageIdx] = true;
  state.code[stageIdx] = s.digit;
  renderBayRow();

  const fb = document.getElementById('feedbackWrap');
  fb.innerHTML = `
    <div class="feedback ${isCorrect ? 'ok' : 'ng'}">
      <div><strong>${isCorrect ? '✔ シャッター解除' : '△ 惜しい、正解を確認しよう'}</strong>：${s.explain}</div>
      <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--metal);">
        <strong style="color:var(--accent-yellow);">なぜ流されるのか(性弱説の視点)</strong>：${s.why}
      </div>
      <div class="code-line">獲得コード：<span class="code-digit">${s.digit}</span></div>
    </div>
  `;
  const btnLabel = stageIdx < STAGES.length-1 ? '次の整備ベイへ' : '最終ゲートへ';
  fb.innerHTML += `<button class="primary" id="nextBtn">${btnLabel}</button>`;
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(stageIdx < STAGES.length-1){ renderStage(stageIdx+1); }
    else { renderVault(); }
  });
}

/* ---------------- 画面: 最終ゲート ---------------- */
function renderVault(){
  headerTitle.textContent = "最終ゲート";
  screen.innerHTML = `
    <div class="panel" style="text-align:center;">
      <div class="bay-tag" style="justify-content:center;"><span class="dot"></span>ALL BAYS CLEARED</div>
      <h2>脱出コードが完成した</h2>
      <div class="code-vault">
        ${state.code.map(d=>`<div class="slot filled">${d}</div>`).join('')}
      </div>
      <button class="primary" id="escapeBtn">ゲートを開けて脱出する</button>
    </div>
  `;
  document.getElementById('escapeBtn').addEventListener('click', renderResult);
}

/* ---------------- 画面: 結果・振り返り ---------------- */
function renderResult(){
  clearInterval(state.timerId);
  state.finishedAt = Date.now();
  const elapsed = TOTAL_SECONDS - state.secondsLeft;
  headerTitle.textContent = "脱出成功";
  screen.innerHTML = `
    <div class="panel">
      <div class="bay-tag"><span class="dot"></span>MISSION COMPLETE</div>
      <h2>脱出成功。お疲れ様でした。</h2>
      <div class="result-summary">
        <div class="box"><div class="n">${fmtTime(elapsed)}</div><div class="l">かかった時間</div></div>
        <div class="box"><div class="n">${STAGES.length}/${STAGES.length}</div><div class="l">突破ベイ数</div></div>
        <div class="box"><div class="n mono">${state.code.join('')}</div><div class="l">脱出コード</div></div>
      </div>

      <h2 style="margin-top:24px;">振り返り：今日の10のポイント</h2>
      ${STAGES.map(s=>`
        <div class="recap-item">
          <div class="theme">${s.theme}</div>
          <div class="point">${s.recap}</div>
        </div>
      `).join('')}

      <div style="margin-top:20px;">
        <div style="font-weight:700; font-size:14.5px;">チームで話してみよう</div>
        <p style="color:var(--text-muted); font-size:13.5px; line-height:1.8; margin-top:6px;">
          この10個の場面のうち、自分の店舗・持ち場で実際に起こりそうなものはどれですか？<br>
          気づいたこと・チームの意見をメモしておきましょう。
        </p>
        <textarea class="reflect" id="reflectInput" placeholder="例：ベイ6の打刻の話、うちの店舗でもありそう…"></textarea>
      </div>

      <button class="primary" id="sheetBtn">結果をスプレッドシートに送信</button>
      <div id="sheetStatus" style="font-size:12.5px; color:var(--text-muted); margin-top:8px; text-align:center;"></div>

      <button class="ghost" id="copyBtn">結果をテキストでコピー(店舗報告用)</button>
      <div class="copy-box" id="copyPreview"></div>
    </div>
  `;

  const updatePreview = ()=>{
    const reflect = document.getElementById('reflectInput').value.trim();
    const text =
`【コンプラ脱出ゲーム 結果】
チーム名：${state.teamName}
クリアタイム：${fmtTime(elapsed)}
脱出コード：${state.code.join('')}
振り返りメモ：${reflect || '(未記入)'}`;
    document.getElementById('copyPreview').textContent = text;
    return text;
  };
  document.getElementById('reflectInput').addEventListener('input', updatePreview);
  updatePreview();

  document.getElementById('sheetBtn').addEventListener('click', ()=>{
    const statusEl = document.getElementById('sheetStatus');
    if(!GOOGLE_FORM_CONFIG.actionUrl){
      statusEl.textContent = 'スプレッドシート連携が未設定です(担当者にご確認ください)。下の「テキストでコピー」をご利用ください。';
      return;
    }
    const reflect = document.getElementById('reflectInput').value.trim();
    const formData = new FormData();
    formData.append(GOOGLE_FORM_CONFIG.entryTeamName, state.teamName);
    formData.append(GOOGLE_FORM_CONFIG.entryElapsed, fmtTime(elapsed));
    formData.append(GOOGLE_FORM_CONFIG.entryCode, state.code.join(''));
    formData.append(GOOGLE_FORM_CONFIG.entryReflect, reflect);

    statusEl.textContent = '送信中…';
    fetch(GOOGLE_FORM_CONFIG.actionUrl, {
      method:'POST',
      mode:'no-cors',
      body: formData
    }).then(()=>{
      statusEl.textContent = '送信しました(スプレッドシート側でご確認ください)';
      showToast('送信しました');
    }).catch(()=>{
      statusEl.textContent = '送信に失敗しました。通信環境をご確認のうえ再度お試しください。';
    });
  });

  document.getElementById('copyBtn').addEventListener('click', ()=>{
    const text = updatePreview();
    navigator.clipboard.writeText(text).then(()=>{
      showToast('コピーしました');
    }).catch(()=>{
      showToast('コピーできませんでした。手動で選択してください');
    });
  });
}

/* ---------------- 起動 ---------------- */
renderStart();
</script>
</body>
</html>
